{% extends "base.html" %}
{% block title %}{{ title }} - {{ business.name }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<p><a href="{% url 'business:employees' business.slug %}">Back to employees</a></p>
{% endblock %}
