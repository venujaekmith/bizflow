{% extends "base.html" %}
{% block title %}Settings - {{ business.name }}{% endblock %}
{% block content %}
<h1>Business settings</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save settings</button>
</form>
<p><a href="{% url 'business:dashboard' business.slug %}">Back to dashboard</a></p>
{% endblock %}
