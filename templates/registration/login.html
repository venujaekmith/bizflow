{% extends "base.html" %}
{% block title %}Sign in - BizFlow{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign in</button>
</form>
<p><a href="{% url 'business:register' %}">Create an account</a></p>
<p><a href="{% url 'business:password_reset' %}">Forgot your password?</a></p>
{% endblock %}
